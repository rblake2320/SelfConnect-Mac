[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfconnect-mac"
version = "0.10.0"
description = "Mac-compatible SelfConnect bridge for AI agent orchestration, with Win32 behavior preserved on Windows and native macOS fallbacks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "automation", "macos", "windows", "desktop", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
mac = [
    "atomacos>=3.3.0",
    "iterm2>=2.7",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-FSEvents>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ScreenCaptureKit>=10.0",
    "pyobjc-framework-Vision>=10.0",
]
uia = [
    "pywinauto>=0.6.8",
]
telegram = [
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
]
ocr = [
    "pytesseract>=0.3.10",
]
claudego = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pywinauto>=0.6.8",
]
full = [
    "pywinauto>=0.6.8",
    "comtypes>=1.4.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
test = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/rblake2320/selfconnect-mac"
Repository = "https://github.com/rblake2320/selfconnect-mac"

[project.scripts]
sc-mac = "selfconnect_mac.cli:main"

[tool.hatch.build.targets.wheel]
include = ["self_connect.py", "selfconnect_mac/**", "claudego/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_self_connect.py"]
